  --sea:#0f5e6e; --sea-soft:#e1eef0; --act:#b8322a; --act-soft:#f8e4e2;

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 60px}

.muted{color:var(--muted)} .small{font-size:13px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}

button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--act);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
a{color:var(--sea)}
.blocks{display:grid;gap:8px}

.blk input{width:20px;height:20px;accent-color:var(--act)}

.j{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer;color:var(--ink);font:inherit}
.j .g{font:700 34px/1.1 var(--ko);display:block}
.j .r{font:500 13px/1.2 var(--mono);color:var(--sea);display:block;margin-top:4px}
.j .h{font-size:11.5px;color:var(--muted);display:block;margin-top:3px;line-height:1.3}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.w{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.w .k{font:600 20px/1.2 var(--ko);display:block}
.w .r{font:500 12px/1.3 var(--mono);color:var(--sea);display:block}
.w .e{font-size:13px;color:var(--muted);display:block}
.note{background:var(--warn-soft);border-radius:10px;padding:12px 14px;font-size:14px}
.tip{background:var(--sea-soft);border-radius:10px;padding:12px 14px;font-size:14px}
ul{margin:0;padding-left:20px;display:grid;gap:5px}

.fc .front{font:700 54px/1.15 var(--ko)}
.fc .back{display:grid;gap:4px}
.fc .rom{font:500 16px/1.3 var(--mono);color:var(--sea)}
.fc .en{font-size:17px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opts button{padding:14px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 17px/1.25 var(--body);cursor:pointer}

.opts button.right{background:var(--ok-soft);border-color:var(--ok)}

.bar-prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden}

.syncline{font:500 11px/1 var(--mono);color:var(--muted)}

  body:"<p>Korean writes sounds in blocks. Each block is one syllable and always starts with a consonant. When a syllable starts with a vowel sound, it uses <span class='ko'>ㅇ</span> as a silent placeholder. So the vowel <span class='ko'>ㅏ</span> on its own is written <span class='ko'>아</span>.</p><p><b>Where the vowel sits:</b> tall vowels (<span class='ko'>ㅏ ㅓ ㅣ</span>) go to the <i>right</i> of the consonant: <span class='ko'>아 어 이</span>. Flat vowels (<span class='ko'>ㅗ ㅜ ㅡ</span>) go <i>underneath</i>: <span class='ko'>오 우 으</span>.</p><p><b>Writing:</b> strokes go left to right, top to bottom. Write each block 10 times on paper while saying it out loud.</p><div class='tip'><b>The two hard ones for English speakers:</b> <span class='ko'>어</span> (eo) is an open 'uh', like 'u' in <i>up</i>, not 'eo' as in <i>video</i>. <span class='ko'>으</span> (eu) is 'oo' said through a smile, with no lip rounding at all.</div>",
  drill:["아","어","오","우","으","이","아이","오이"]},
 {id:"L2",day:2,title:"Basic consonants",ko:"자음",jamo:["c1"],mins:25,
  video:[["Go! Billy Korean: Learn Hangul, consonants",yt("Go Billy Korean learn Hangul consonants")],["Talk To Me In Korean: Hangeul basic consonants",yt("Talk To Me In Korean Hangeul basic consonants")]],
  body:"<p>Ten everyday consonants. Combine each with a vowel to make a block: <span class='ko'>ㄱ + ㅏ = 가</span>, <span class='ko'>ㄴ + ㅗ = 노</span>.</p><p><b>Soft consonants:</b> <span class='ko'>ㄱ ㄷ ㅂ ㅈ</span> sit between the English pairs g/k, d/t, b/p and j/ch. At the start of a word they sound closer to k, t, p and ch. Between vowels they soften to g, d, b and j. That's why <span class='ko'>고기</span> sounds like 'ko-gi'.</p><p><b><span class='ko'>ㄹ</span></b> is a quick tongue flap, like the 'tt' in American 'butter', between vowels and at the start of a word. At the end of a syllable it becomes l.</p><p><b><span class='ko'>ㅅ</span></b> becomes 'sh' before <span class='ko'>ㅣ</span>: <span class='ko'>시</span> = 'shi'.</p><div class='tip'><b>Today's practice:</b> read every word in the list aloud. At breakfast, try to sound out anything written in Hangul around you.</div>",
  drill:["가","나","다","라","마","바","사","자","하","나무","바다","어머니","아버지"]},
 {id:"L3",day:3,title:"Aspirated and tense consonants",ko:"격음 · 경음",jamo:["c2"],mins:20,tutor:true,
  video:[["Go! Billy Korean: aspirated and tense consonants",yt("Go Billy Korean aspirated tense consonants")],["Korean three-way consonant contrast ㄱ ㅋ ㄲ",yt("Korean pronunciation ㄱ ㅋ ㄲ difference")]],
  body:"<p>Korean has three versions of k, t, p and ch, plus two versions of s. Swapping one for another changes the word.</p><div class='tbl'><table><thead><tr><th>Soft</th><th>Aspirated (puff)</th><th>Tense (tight)</th></tr></thead><tbody><tr><td class='ko'>가</td><td class='ko'>카</td><td class='ko'>까</td></tr><tr><td class='ko'>다</td><td class='ko'>타</td><td class='ko'>따</td></tr><tr><td class='ko'>바</td><td class='ko'>파</td><td class='ko'>빠</td></tr><tr><td class='ko'>자</td><td class='ko'>차</td><td class='ko'>짜</td></tr><tr><td class='ko'>사</td><td>—</td><td class='ko'>싸</td></tr></tbody></table></div><p><b>The paper test:</b> hold a tissue in front of your mouth. The aspirated sounds (<span class='ko'>ㅋ ㅌ ㅍ ㅊ</span>) should make it flutter. The tense ones (<span class='ko'>ㄲ ㄸ ㅃ ㅉ ㅆ</span>) should leave it still: tighten your throat, push no air, and say them slightly higher in pitch.</p><div class='note'><b>Tutor trial tonight, 19:00.</b> Ask them to listen to you read the table above and correct your vowels from day 1, especially <span class='ko'>어</span> and <span class='ko'>으</span>.</div>",
  drill:["가","카","까","다","타","따","바","파","빠","자","차","짜","사","싸","아빠","커피"]},
 {id:"L4",day:4,title:"Y-vowels and combined vowels",ko:"이중모음",jamo:["v2"],mins:25,checkin:true,
  video:[["Go! Billy Korean: double vowels",yt("Go Billy Korean learn Hangul double vowels")],["Talk To Me In Korean: Hangeul double vowels",yt("Talk To Me In Korean Hangeul double vowels")]],
  body:"<p><b>Add a stroke, add a 'y':</b> <span class='ko'>ㅏ→ㅑ</span> (a→ya), <span class='ko'>ㅓ→ㅕ</span>, <span class='ko'>ㅗ→ㅛ</span>, <span class='ko'>ㅜ→ㅠ</span>.</p><p><b><span class='ko'>ㅐ</span> and <span class='ko'>ㅔ</span></b> both sound like 'e' in <i>bed</i> in modern Seoul speech. You only need to know which one a word is spelled with.</p><p><b>Combine two vowels for a 'w' sound:</b> <span class='ko'>ㅗ+ㅏ=ㅘ</span> (wa), <span class='ko'>ㅜ+ㅓ=ㅝ</span> (wo), <span class='ko'>ㅜ+ㅣ=ㅟ</span> (wi). <span class='ko'>ㅚ ㅙ ㅞ</span> all sound like 'we' in <i>wet</i>.</p><p><b><span class='ko'>ㅢ</span></b> is 'eu' gliding to 'ee' (<span class='ko'>의사</span>, doctor). In the middle of words it often relaxes to 'i'.</p><div class='note'><b>Day 4 check-in.</b> Use the box on the Today tab to say how the hour has felt so far. We'll adjust the load from there.</div>",
  drill:["야","여","요","유","애","에","와","워","위","의","우유","여자","노래","회사","의사"]},
 {id:"L5",day:5,title:"Final consonants and linking",ko:"받침 · 연음",jamo:[],mins:25,
  video:[["Go! Billy Korean: final consonants (batchim)",yt("Go Billy Korean batchim final consonants")],["Talk To Me In Korean: batchim pronunciation",yt("Talk To Me In Korean batchim pronunciation")]],
  body:"<p>A consonant at the bottom of a block is a <b>batchim</b> (final consonant): <span class='ko'>한 = ㅎ + ㅏ + ㄴ</span>. However they're spelled, final consonants make only <b>seven sounds</b>:</p><div class='tbl'><table><thead><tr><th>Sound</th><th>Spelled as</th><th>Example</th></tr></thead><tbody><tr><td>k</td><td class='ko'>ㄱ ㅋ ㄲ</td><td class='ko'>책, 밖</td></tr><tr><td>n</td><td class='ko'>ㄴ</td><td class='ko'>한</td></tr><tr><td>t</td><td class='ko'>ㄷ ㅌ ㅅ ㅆ ㅈ ㅊ ㅎ</td><td class='ko'>옷, 꽃, 맛</td></tr><tr><td>l</td><td class='ko'>ㄹ</td><td class='ko'>물</td></tr><tr><td>m</td><td class='ko'>ㅁ</td><td class='ko'>김치</td></tr><tr><td>p</td><td class='ko'>ㅂ ㅍ</td><td class='ko'>밥, 앞</td></tr><tr><td>ng</td><td class='ko'>ㅇ</td><td class='ko'>사랑</td></tr></tbody></table></div><p><b>Final sounds are clipped:</b> close your mouth on them without releasing any air. <span class='ko'>밥</span> is 'bap' with the lips shut at the end.</p><p><b>Linking:</b> when the next block starts with silent <span class='ko'>ㅇ</span>, the final consonant slides across into it. <span class='ko'>한국어</span> is said 'han-gu-geo', <span class='ko'>음악</span> 'eu-mak', <span class='ko'>맛있어요</span> 'ma-si-sseo-yo'.</p><div class='tip'><b>Sound change you'll hear constantly:</b> a final <span class='ko'>ㅂ</span> before <span class='ko'>ㄴ</span> becomes 'm'. So <span class='ko'>감사합니다</span> is said 'gam-sa-ham-ni-da'.</div>",
  drill:["한국","한국어","밥","물","김치","사랑","친구","옷","꽃","음악","이름"]},
 {id:"L6",day:6,title:"Greetings and introducing yourself",ko:"인사",jamo:[],mins:20,
  video:[["Basic Korean greetings for beginners",yt("Korean greetings for beginners 안녕하세요 감사합니다")],["How to introduce yourself in Korean",yt("introduce yourself in Korean beginner 저는 이에요")]],
  body:"<p>Korean changes its endings depending on who you're talking to. Start with the <b>polite style</b> (endings in <span class='ko'>-요</span>), which is right with almost anyone. The <b>formal style</b> (<span class='ko'>-습니다</span>) is for first meetings, elders and set phrases. Jane's parents will get formal style in week 7.</p><p><b>Two goodbyes:</b> say <span class='ko'>안녕히 가세요</span> ('go in peace') to someone who is leaving, and <span class='ko'>안녕히 계세요</span> ('stay in peace') when you are the one leaving.</p><p><b>&ldquo;I am …&rdquo;:</b> <span class='ko'>저는 [name]이에요</span> after a final consonant, <span class='ko'>[name]예요</span> after a vowel. <span class='ko'>캘럼</span> ends in <span class='ko'>ㅁ</span>, so it's <span class='ko'>저는 캘럼이에요</span>.</p>",
  drill:["안녕하세요","감사합니다","죄송합니다","괜찮아요","안녕히 가세요","안녕히 계세요","만나서 반갑습니다","저는 캘럼이에요"]},
 {id:"L7",day:7,title:"This, that, and survival questions",ko:"이거 뭐예요?",jamo:[],mins:20,
  video:[["이, 그, 저: this and that in Korean",yt("Korean this that 이거 그거 저거 beginner")],["Survival Korean phrases",yt("survival Korean phrases beginners")]],
  body:"<p><b>Three kinds of 'that':</b> <span class='ko'>이거</span> is this (near me), <span class='ko'>그거</span> is that (near you), and <span class='ko'>저거</span> is that over there (away from both of us).</p><p><b>Asking:</b> <span class='ko'>이거 뭐예요?</span> means 'what is this?'. To answer, add <span class='ko'>-예요/-이에요</span> to a noun: <span class='ko'>커피예요</span> (it's coffee), <span class='ko'>물이에요</span> (it's water).</p><p><b>Saying no:</b> <span class='ko'>아니에요</span> means 'it isn't'. <span class='ko'>커피 아니에요</span> = 'it's not coffee'.</p><p><b>Lifelines</b> for your tutor sessions and for meeting Jane's family: <span class='ko'>천천히 말해 주세요</span> (please speak slowly), <span class='ko'>다시 한번 말해 주세요</span> (please say that again).</p>",
  drill:["이거 뭐예요?","이거","그거","저거","아니에요","맞아요","몰라요","천천히 말해 주세요"]}
];

  video:[["Korean topic particles 은/는",yt("Korean particle 은 는 explained beginner")],["Saying your nationality and job in Korean",yt("Korean nationality and job 사람이에요 beginner")]],
  body:"<p><b>The topic marker <span class='ko'>은/는</span></b> marks what you're talking about, a bit like 'as for…'. Use <span class='ko'>는</span> after a vowel and <span class='ko'>은</span> after a consonant: <span class='ko'>저는</span> (as for me), <span class='ko'>캘럼은</span>, <span class='ko'>이름은</span>.</p><p><b>Nationality</b> is country + <span class='ko'>사람</span> (person): <span class='ko'>호주 사람</span> (Australian), <span class='ko'>한국 사람</span> (Korean).</p><p><b>Job:</b> noun + <span class='ko'>예요/이에요</span>. <span class='ko'>변호사</span> ends in a vowel, so it's <span class='ko'>변호사예요</span>. <span class='ko'>학생</span> ends in a consonant: <span class='ko'>학생이에요</span>.</p><p><b>Three questions you'll be asked at every first meeting:</b> <span class='ko'>이름이 뭐예요?</span> (your name?), <span class='ko'>어느 나라 사람이에요?</span> (which country?), <span class='ko'>무슨 일 해요?</span> (what work do you do?).</p><div class='tip'><b>Culture note:</b> a polite reply to a question about your job can be short. <span class='ko'>변호사예요</span> is enough; follow up with <span class='ko'>지금은 쉬어요</span> (I'm taking a break now) if you want to mention the sabbatical.</div>",
  drill:["저는 캘럼이에요","호주 사람이에요","변호사예요","이름이 뭐예요?","어느 나라 사람이에요?","무슨 일 해요?","반가워요"],
  rp:{title:"Introducing yourself at a dinner",role:"Jane's friend Minji, meeting Callum for the first time at a dinner in Singapore. Ask his name, where he is from and what he does.",goal:"Say your name, nationality and job."},
  fsi:"Unit 1: listen and repeat the opening dialogue and the first drills."},
 {id:"L9",day:9,title:"Family",ko:"가족",jamo:[],mins:20,
  video:[["Korean family members (male speaker)",yt("Korean family words 형 누나 for men beginner")],["있어요 and 없어요",yt("Korean 있어요 없어요 beginner lesson")]],
  body:"<p><b><span class='ko'>있어요 / 없어요</span></b> mean 'there is / there isn't', and also 'I have / I don't have'. <span class='ko'>시간 있어요?</span> = do you have time?</p><p><b>The subject marker <span class='ko'>이/가</span>:</b> <span class='ko'>가</span> after a vowel, <span class='ko'>이</span> after a consonant. <span class='ko'>누나가 있어요</span> (I have an older sister), <span class='ko'>형이 있어요</span> (I have an older brother). In casual speech it's often dropped.</p><p><b>Family words depend on who's speaking.</b> As a man you call an older brother <span class='ko'>형</span> and an older sister <span class='ko'>누나</span>. (Jane would say <span class='ko'>오빠</span> and <span class='ko'>언니</span>.) Younger siblings are the same for everyone: <span class='ko'>남동생, 여동생</span>.</p><div class='tip'><b>For meeting her parents:</b> address them as <span class='ko'>아버님</span> and <span class='ko'>어머님</span>, the respectful forms used by a partner or son-in-law. Plain <span class='ko'>아버지/어머니</span> are for your own parents.</div>",
  drill:["가족","부모님","형제 있어요?","누나 있어요","형제 없어요","가족은 호주에 있어요","아버님","어머님"],
  rp:{title:"Her mother asks about your family",role:"Jane's mother, warm but curious, asking Callum about his family (parents, siblings, where they live). Address him politely.",goal:"Talk about who's in your family and where they live."},
  fsi:"Unit 1: continue the drills; replay any you stumbled on."},
 {id:"L10",day:10,title:"Ordering, asking and prices",ko:"주세요 · 얼마예요?",jamo:[],mins:20,
  video:[["Ordering food in Korean",yt("ordering food in Korean restaurant beginner 주세요")],["Sino-Korean numbers and prices",yt("Korean Sino numbers prices won beginner")]],
  body:"<p><b><span class='ko'>[thing] 주세요</span></b> = '[thing], please'. <span class='ko'>물 주세요</span>, <span class='ko'>이거 하나 주세요</span>.</p><p><b><span class='ko'>[thing] 있어요?</span></b> = 'do you have [thing]?' <span class='ko'>메뉴 있어요?</span></p><p><b>Prices use Sino-Korean numbers:</b> <span class='ko'>일 이 삼 사 오 육 칠 팔 구 십</span>, then <span class='ko'>백</span> (100), <span class='ko'>천</span> (1,000), <span class='ko'>만</span> (10,000). Korean groups by ten-thousands: 15,000 won is <span class='ko'>만 오천 원</span>. 4,500 is <span class='ko'>사천오백 원</span>.</p><p><b>Getting attention:</b> <span class='ko'>여기요!</span> or <span class='ko'>저기요!</span> calls staff over. That's normal in Korea, not rude.</p><div class='tip'>Counting items (one, two) uses the <i>other</i>, native number set: <span class='ko'>하나, 둘</span>. You'll learn those on day 20. For now, <span class='ko'>하나 주세요</span> (one, please) is enough.</div>",
  drill:["여기요!","메뉴 있어요?","이거 하나 주세요","맥주 주세요","얼마예요?","만 오천 원이에요","계산서 주세요"],
  rp:{title:"Korean BBQ restaurant",role:"A friendly server at a Korean BBQ restaurant in Seoul. Greet him, take his order, answer prices, bring the bill.",goal:"Get the server's attention, order, ask a price, ask for the bill."},
  fsi:"Unit 1 → start Unit 2. Download Units 1–3 to your phone today for the boat."},

 {id:"L12",day:16,title:"Present tense",ko:"-아요/-어요",jamo:[],mins:20,
  video:[["Korean present tense -아요/-어요",yt("Korean present tense 아요 어요 beginner")],["Talk To Me In Korean: basic present tense",yt("Talk To Me In Korean basic present tense")]],
  body:"<p>Korean verbs are listed ending in <span class='ko'>-다</span> (<span class='ko'>가다</span>, to go). Drop <span class='ko'>-다</span> to get the stem, then add the polite ending:</p><ul><li><b>Stem's last vowel is <span class='ko'>ㅏ</span> or <span class='ko'>ㅗ</span> → <span class='ko'>-아요</span>:</b> <span class='ko'>살다 → 살아요</span>. Vowels merge: <span class='ko'>가다 → 가요</span>, <span class='ko'>오다 → 와요</span>, <span class='ko'>보다 → 봐요</span>.</li><li><b>Any other vowel → <span class='ko'>-어요</span>:</b> <span class='ko'>먹다 → 먹어요</span>, <span class='ko'>마시다 → 마셔요</span>.</li><li><b><span class='ko'>하다</span> → <span class='ko'>해요</span></b>, always: <span class='ko'>일하다 → 일해요</span>, <span class='ko'>운동하다 → 운동해요</span>.</li></ul><p>The same form is a statement or a question, depending on your tone: <span class='ko'>운동해요.</span> (I work out.) / <span class='ko'>운동해요?</span> (Do you work out?)</p><p><b>Word order:</b> the verb goes last. <span class='ko'>저는 매일 운동해요</span> = I every day work out.</p>",
  drill:["가요","와요","먹어요","마셔요","봐요","일해요","운동해요","주말에 뭐 해요?","보통 운동해요"],
  rp:{title:"What do you do at weekends?",role:"Jane's cousin Seo-yeon, chatting casually but politely with Callum about weekends and daily routine.",goal:"Describe your routine and weekends in the present tense."},
  fsi:"Unit 2: drills."},
 {id:"L13",day:17,title:"Wanting to",ko:"-고 싶어요",jamo:[],mins:20,tutor:true,
  video:[["Korean -고 싶어요 (I want to)",yt("Korean 고 싶어요 want to beginner")],["보고 싶어요: I miss you",yt("Korean 보고 싶어요 meaning I miss you")]],
  body:"<p><b>Stem + <span class='ko'>-고 싶어요</span></b> = 'I want to…'. No vowel rules this time: <span class='ko'>가다 → 가고 싶어요</span>, <span class='ko'>먹다 → 먹고 싶어요</span>.</p><p><b>Ask:</b> <span class='ko'>뭐 하고 싶어요?</span> (what do you want to do?), <span class='ko'>어디 가고 싶어요?</span> (where do you want to go?)</p><p><b>Suggest:</b> <span class='ko'>같이 가요!</span> means 'let's go together'. The plain present tense works as a suggestion with the right tone.</p><div class='tip'><b>One for Jane:</b> <span class='ko'>보고 싶어요</span> literally means 'I want to see you', and it's how Koreans say <b>'I miss you'</b>. With someone close you'll often hear the casual <span class='ko'>보고 싶어</span>.</div>",
  drill:["가고 싶어요","먹고 싶어요","보고 싶어요","뭐 하고 싶어요?","한국에 가고 싶어요","한국 음식 먹고 싶어요","같이 가요"],
  rp:{title:"Planning a trip to Korea",role:"Jane, planning a trip to Korea with Callum. Ask where he wants to go, what he wants to eat and when. Speak in friendly polite Korean.",goal:"Say where you want to go and what you want to do and eat."},
  fsi:"Unit 2: drills."},
 {id:"L14",day:18,title:"Past tense",ko:"-았/었어요",jamo:[],mins:20,
  video:[["Korean past tense -았/었어요",yt("Korean past tense 았어요 었어요 beginner")],["Talking about last weekend in Korean",yt("Korean talk about past weekend beginner")]],
  body:"<p>Same vowel rule as the present tense, with <span class='ko'>-았/었어요</span>:</p><ul><li><span class='ko'>ㅏ/ㅗ</span> stems → <span class='ko'>-았어요</span>: <span class='ko'>가다 → 갔어요</span>, <span class='ko'>오다 → 왔어요</span>, <span class='ko'>보다 → 봤어요</span>.</li><li>Others → <span class='ko'>-었어요</span>: <span class='ko'>먹다 → 먹었어요</span>, <span class='ko'>마시다 → 마셨어요</span>.</li><li><span class='ko'>하다 → 했어요</span>: <span class='ko'>다이빙하다 → 다이빙했어요</span>.</li></ul><p><b>Time words go near the front:</b> <span class='ko'>어제</span> (yesterday), <span class='ko'>지난주</span> (last week), <span class='ko'>이번 달</span> (this month).</p><p><b>Describing how it was:</b> <span class='ko'>재미있었어요</span> (it was fun), <span class='ko'>좋았어요</span> (it was good), <span class='ko'>맛있었어요</span> (it was delicious).</p>",
  drill:["갔어요","먹었어요","했어요","어제 뭐 했어요?","이번 달에 태국에 갔어요","다이빙했어요","재미있었어요"],
  rp:{title:"What did you do this month?",role:"Jane's brother, catching up with Callum and asking what he did recently (trip, diving, food).",goal:"Tell the story of your month in the past tense."},
  fsi:"Unit 2 → Unit 3."},
 {id:"L15",day:19,title:"Places: 에 and 에서",ko:"어디 가요?",jamo:[],mins:20,
  video:[["Korean 에 vs 에서",yt("Korean 에 vs 에서 difference beginner")]],
  body:"<p>Both attach to a place, but they do different jobs:</p><ul><li><b><span class='ko'>에</span></b>: destination or where something <i>is</i>. Used with <span class='ko'>가다, 오다, 있다, 살다</span>. <span class='ko'>집에 가요</span> (I'm going home). <span class='ko'>싱가포르에 살아요</span> (I live in Singapore).</li><li><b><span class='ko'>에서</span></b>: where an action <i>happens</i>. <span class='ko'>회사에서 일해요</span> (I work at a company). <span class='ko'>식당에서 먹어요</span> (I eat at a restaurant).</li></ul><p><b>Bonus:</b> <span class='ko'>에서</span> also means 'from': <span class='ko'>퍼스에서 왔어요</span> (I came from Perth).</p><div class='tip'><span class='ko'>살다</span> (to live) takes either: <span class='ko'>싱가포르에 살아요</span> and <span class='ko'>싱가포르에서 살아요</span> are both correct.</div>",
  drill:["어디 가요?","집에 가요","헬스장에 가요","싱가포르에 살아요","회사에서 일해요","퍼스에서 왔어요"],
  rp:{title:"Where you live and work",role:"Jane's aunt, asking Callum where he lives, where he works, and where he goes on weekends.",goal:"Use 에 and 에서 correctly to talk about places."},
  fsi:"Unit 3: drills."},
 {id:"L16",day:20,title:"Native numbers, time and age",ko:"몇 시 · 몇 살",jamo:[],mins:20,
  video:[["Korean native numbers 하나 둘 셋",yt("Korean native numbers 하나 둘 셋 beginner")],["Telling time in Korean",yt("telling time in Korean 시 분 beginner")]],
  body:"<p>Korean has two number sets. You know the Sino-Korean one (prices). The <b>native</b> set is for counting things, hours and age:</p><p class='ko' style='font-size:18px'>하나 둘 셋 넷 다섯 여섯 일곱 여덟 아홉 열 · 스물(20) · 서른(30)</p><p><b>Before a counter, 1–4 and 20 shorten:</b> <span class='ko'>한, 두, 세, 네, 스무</span>. So: <span class='ko'>한 시</span> (1 o'clock), <span class='ko'>두 개</span> (two items), <span class='ko'>서른한 살</span> (31 years old).</p><p><b>Time mixes both sets:</b> hours are native, minutes are Sino-Korean. <span class='ko'>세 시 삼십 분</span> = 3:30.</p><div class='tip'><b>Age and politeness:</b> ask a peer <span class='ko'>몇 살이에요?</span> Never ask Jane's parents that. For elders, the honorific <span class='ko'>연세가 어떻게 되세요?</span> is used, though it's best not to ask at a first meeting at all.</div>",
  drill:["하나 둘 셋","몇 시예요?","세 시예요","몇 살이에요?","서른한 살이에요","두 개 주세요"],
  rp:{title:"Making plans",role:"Jane, making plans with Callum for dinner and a movie. Ask about times and how many people.",goal:"Use native numbers for times and counting."},
  fsi:"Unit 3: drills."},
 {id:"L17",day:21,title:"Review: your 60-second introduction",ko:"자기소개",jamo:[],mins:30,tutor:true,
  video:[["Korean self-introduction examples",yt("Korean self introduction 자기소개 beginner example")]],
  body:"<p><b>Milestone:</b> deliver a 60-second introduction with no notes. Model script, which you'll adapt with your tutor:</p><div class='tbl'><table><tbody><tr><td class='ko'>안녕하세요. 저는 캘럼이에요.</td><td>Hello, I'm Callum.</td></tr><tr><td class='ko'>호주 사람이에요. 퍼스에서 왔어요.</td><td>I'm Australian, from Perth.</td></tr><tr><td class='ko'>지금은 싱가포르에 살아요.</td><td>I live in Singapore now.</td></tr><tr><td class='ko'>변호사예요. 서른한 살이에요.</td><td>I'm a lawyer. I'm 31.</td></tr><tr><td class='ko'>운동을 좋아해요. 여행도 좋아해요.</td><td>I like working out. I like travelling too.</td></tr><tr><td class='ko'>이번 달에 태국에서 다이빙했어요.</td><td>This month I went diving in Thailand.</td></tr><tr><td class='ko'>요즘 한국어를 공부해요.</td><td>These days I'm studying Korean.</td></tr><tr><td class='ko'>만나서 반가워요.</td><td>Nice to meet you.</td></tr></tbody></table></div><p class='small muted'>New bits: <span class='ko'>을/를</span> marks the object (<span class='ko'>운동을</span>); <span class='ko'>도</span> means 'also'; <span class='ko'>요즘</span> means 'these days'. Week 4 covers them properly.</p>",
  drill:["안녕하세요. 저는 캘럼이에요.","호주 사람이에요. 퍼스에서 왔어요.","지금은 싱가포르에 살아요.","운동을 좋아해요.","이번 달에 태국에서 다이빙했어요.","요즘 한국어를 공부해요."],
  rp:{title:"The first dinner",role:"Jane's mother at a first family dinner. Ask Callum about himself, his family, his work, his recent trip, and whether he likes Korean food. Be warm and use polite speech.",goal:"Hold the whole conversation using everything from weeks 1–3."},
  fsi:"Unit 3: review the drills you find hardest."}

ROADMAP = ROADMAP.filter(function(r){return r[0]!=="Week 2"&&r[0]!=="Week 3";});

// ---------- STATE ----------
var LSKEY="korean-course-v1";
var state = {lessons:{},cards:{},quizzes:[],log:{},checkin:"",updated:0};
try{var c=JSON.parse(localStorage.getItem(LSKEY)||"null"); if(c&&typeof c==="object") state=Object.assign(state,c);}catch(e){}
var db=null, ref=null, syncNote="Saved on this device", pending=null, writing=false;
function persist(){
  state.updated=Date.now();
  try{localStorage.setItem(LSKEY,JSON.stringify(state));}catch(e){}
  if(!ref) return;
  clearTimeout(pending); pending=setTimeout(flush,800);
}
async function flush(){
  if(!ref) return;
  if(writing){pending=setTimeout(flush,600);return;}
  writing=true;
  try{await ref.set(JSON.parse(JSON.stringify(state))); syncNote="Synced";}
  catch(e){ if(e&&e.code==="unavailable"){setTimeout(flush,1500+Math.random()*1500);} syncNote="Couldn't sync, saved on this device"; }
  writing=false; var s=document.getElementById("sync"); if(s) s.textContent=syncNote;
}
// ---------- HELPERS ----------

    if(d[1]===14)acc.push(head+comp(d[0],13,0));
    if(d[1]===6)acc.push(head+comp(d[0],20,0));

function bindDrills(){

  var b;
  if((b=el("drPlayBtn")))b.onclick=function(){if(dr.playing){drStop();drPaint();}else drPlay(dr.i);};
  if((b=el("drPrev")))b.onclick=function(){drPlay(dr.i-1);};
  if((b=el("drNext")))b.onclick=function(){drPlay(dr.i+1);};

  var list=el("drList");if(list)list.onclick=function(e){var r=e.target.closest("[data-seg]");if(r)drPlay(+r.dataset.seg);};
  document.querySelectorAll("[data-drtape]").forEach(function(x){x.onclick=function(){var keep=dr.mode;drPlay(+x.dataset.drtape);};});
  document.querySelectorAll("[data-drlink]").forEach(function(x){x.onclick=function(){drLinks()[x.dataset.drlink]=dr.i;persist();var y=window.scrollY;render();window.scrollTo(0,y);};});
  if((b=el("drLinkSel")))b.onchange=function(){if(!b.value)return;drLinks()[b.value]=dr.i;persist();var y=window.scrollY;render();window.scrollTo(0,y);};
  if((b=el("drStar")))b.onclick=function(){var f=fsiState();f.stars[dr.key]=f.stars[dr.key]||{};if(f.stars[dr.key][dr.i])delete f.stars[dr.key][dr.i];else f.stars[dr.key][dr.i]=1;persist();var y=window.scrollY;render();window.scrollTo(0,y);};
  if((b=el("drHideEn")))b.onchange=function(){fsiState().hideEn=b.checked;persist();var y=window.scrollY;render();window.scrollTo(0,y);};
  document.querySelectorAll("[data-drdel]").forEach(function(x){x.onclick=function(){var k=x.dataset.drdel;drStop();delete dr.tapes[k];Promise.all([idbDel("audio",k),idbDel("kv","seg:"+k),idbSet("kv","tapes",dr.tapes)]).then(function(){if(dr.key===k){dr.key=null;dr.segs=[];var l=tapeList();if(l.length)return drLoad(l[0].key);}}).then(function(){render();});};});
  drPaint();
}

    if(/\.xlsx$/i.test(f.name))return xlsxRows(ab).then(function(rows){done(parseTable(rows));},function(){el("wtMsg").textContent="Couldn't open that Excel file. Try copying the rows and pasting them in the box instead.";});

  });

function cueAt(cues,t){var lo=0,hi=cues.length-1,r=-1;while(lo<=hi){var m=(lo+hi)>>1;if(cues[m][0]<=t){r=m;lo=m+1;}else hi=m-1;}return (r>=0&&t<cues[r][1])?r:-1;}
function cueBefore(cues,t){var lo=0,hi=cues.length-1,r=-1;while(lo<=hi){var m=(lo+hi)>>1;if(cues[m][0]<=t){r=m;lo=m+1;}else hi=m-1;}return r;}

function wtEnFor(c){if(!wt.en.length)return "";var mid=(c[0]+Math.min(c[1],c[0]+2))/2-0+wt.offKo-wt.offEn,i=cueAt(wt.en,mid);if(i<0){i=cueBefore(wt.en,mid);if(i<0||mid-wt.en[i][1]>1.5)return "";}return wt.en[i][2];}

function wtPaint(){
  var v=wt.videoEl,fol=wt.mode==="follow",ko=el("wtKo"),en=el("wtEn"),ro=el("wtRo");if(!ko||(!fol&&!v))return;
  var t=wtNow(),i=cueAt(wt.ko,t-wt.offKo);
  if(fol){var ck=el("wtClock");if(ck)ck.textContent=wt.untimed?"":fmtT(t)+(wt.clk.run?"":" · paused");if(i<0&&wt.ko.length){var pb=cueBefore(wt.ko,t-wt.offKo);if(pb>=0&&(wt.untimed||t-wt.offKo-wt.ko[pb][1]<1.5))i=pb;}}
  if(!fol&&wt.auto&&wt.cur>=0&&i!==wt.cur&&!v.paused&&wt.pausedFor!==wt.cur&&wt.ko[wt.cur]&&t-wt.offKo>=wt.ko[wt.cur][1]-0.05){wt.pausedFor=wt.cur;v.pause();return;}
  if(i!==wt.cur){wt.cur=i;
    if(i>=0){ko.innerHTML=wt.showKo?tokHtml(wt.ko[i][2]):"";ko.setAttribute("data-ctx",wt.ko[i][2]);ko.setAttribute("data-src",wt.name);}else ko.innerHTML="";
    if(ro)ro.textContent=(wt.showRo&&i>=0)?romOf(wt.ko[i][2]):"";
    if(fol)en.textContent=(wt.showEn&&i>=0)?wtEnFor(wt.ko[i]):"";
    var list=el("wtList");if(list){var on=list.querySelector(".on");if(on)on.classList.remove("on");var row=i>=0?list.querySelector('[data-cue="'+i+'"]'):null;if(row){row.classList.add("on");var top=row.offsetTop-list.offsetTop;if(top<list.scrollTop||top>list.scrollTop+list.clientHeight-60)list.scrollTop=Math.max(0,top-80);}}
  }
  if(!fol){var j=wt.en.length?cueAt(wt.en,t-wt.offEn):-1;en.textContent=(wt.showEn&&j>=0)?wt.en[j][2]:"";}
}
function wtLoop(){if(current!=="watch"){wt.raf=null;return;}wtPaint();wt.raf=requestAnimationFrame(wtLoop);}
function wtGo(i){var c=wt.ko[i];if(!c)return;wt.pausedFor=-1;wt.cur=-2;if(wt.mode==="follow"){clkSet(c[0]+wt.offKo+0.01);if(!wt.untimed)clkRun(true);return;}var v=wt.videoEl;if(v&&wt.url){v.currentTime=Math.max(0,c[0]+wt.offKo+0.01);var p=v.play();if(p&&p.catch)p.catch(function(){});}}
function wtLine(d){if(!wt.ko.length)return;var t=wtNow()-wt.offKo,i=cueBefore(wt.ko,t+0.01);if(d===0){if(i<0)i=0;}else if(d<0){i=(wt.mode!=="follow"&&i>=0&&t-wt.ko[i][0]>1.2)?i:i-1;if(i<0)i=0;}else{i=Math.min(wt.ko.length-1,i+1);}wtGo(i);}

  document.querySelectorAll("[data-wtmode]").forEach(function(x){x.onclick=function(){if(wt.mode==="follow")clkRun(false);wt.mode=x.dataset.wtmode;wtSave();render();};});
  el("wtKoF").onchange=function(){if(this.files&&this.files[0])wtReadFile(this.files[0],null);};
  el("wtEnF").onchange=function(){if(this.files&&this.files[0])wtReadFile(this.files[0],"en");};
  el("wtPasteGo").onclick=function(){var txt=el("wtPaste").value||"";if(!txt.trim())return;var res=(txt.indexOf("-->")>=0||/^Dialogue:/m.test(txt))?{cues:parseSubs(txt)}:parseTable(splitRows(txt));if((res.cues&&!res.cues.length)||(!res.cues&&!res.ko.length&&!res.en.length)){el("wtMsg").textContent="couldn't find subtitle lines in the pasted text";return;}wtApply(res,null,wt.name||"Pasted subtitles");};
  if((b=el("wtVid")))b.onchange=function(){var f=this.files&&this.files[0];if(!f)return;if(wt.url){try{URL.revokeObjectURL(wt.url);}catch(e){}}wt.url=URL.createObjectURL(f);wt.name=f.name.replace(/\.[a-z0-9]+$/i,"");wtSave();render();};

  el("wtShowKo").onchange=function(){wt.showKo=this.checked;wt.cur=-2;};el("wtShowEn").onchange=function(){wt.showEn=this.checked;wt.cur=-2;};el("wtShowRo").onchange=function(){wt.showRo=this.checked;wt.cur=-2;};
  if((b=el("wtAuto")))b.onchange=function(){wt.auto=this.checked;};

  document.querySelectorAll(".wtoff").forEach(function(x){x.onclick=function(){var p=x.dataset.off.split(":");if(p[0]==="ko"){wt.offKo=Math.round((wt.offKo+(+p[1]))*100)/100;el("wtOffKo").textContent=wt.offKo.toFixed(2)+" s";}else{wt.offEn=Math.round((wt.offEn+(+p[1]))*100)/100;el("wtOffEn").textContent=wt.offEn.toFixed(2)+" s";}wt.cur=-2;wtSave();};});
  var list=el("wtList");if(list)list.onclick=function(e){var x=e.target.closest("[data-wtseek]");if(x)wtGo(+x.dataset.wtseek);};
  if(!wt.raf)wt.raf=requestAnimationFrame(wtLoop);
}
document.addEventListener("keydown",function(e){
  if(current!=="watch")return;var tg=e.target&&e.target.tagName;if(tg==="INPUT"||tg==="TEXTAREA"||tg==="SELECT")return;
  var k=e.key.toLowerCase(),v=wt.videoEl,fol=wt.mode==="follow",c;
  if(k==="escape"){closeSheet();return;}
  if(!fol&&!v)return;
  if(k===" "){e.preventDefault();if(fol){if(!wt.untimed)clkRun(!wt.clk.run);}else if(v.paused){wt.pausedFor=wt.cur;var p=v.play();if(p&&p.catch)p.catch(function(){});}else v.pause();}
  else if(k==="a"||k==="arrowleft"){e.preventDefault();wtLine(-1);}
  else if((k==="s"||k==="arrowdown")&&!fol){e.preventDefault();wtLine(0);}
  else if(k==="d"||k==="arrowright"){e.preventDefault();wtLine(1);}
  else if(k==="["&&fol){clkSet(wtNow()-0.5);}
  else if(k==="]"&&fol){clkSet(wtNow()+0.5);}
  else if(k==="e"){wt.showEn=!wt.showEn;wt.cur=-2;if((c=el("wtShowEn")))c.checked=wt.showEn;}
  else if(k==="r"){wt.showRo=!wt.showRo;wt.cur=-2;if((c=el("wtShowRo")))c.checked=wt.showRo;}
  else if(k==="k"){wt.showKo=!wt.showKo;wt.cur=-2;if((c=el("wtShowKo")))c.checked=wt.showKo;}
  else if(k==="p"&&!fol){wt.auto=!wt.auto;if((c=el("wtAuto")))c.checked=wt.auto;}
});
